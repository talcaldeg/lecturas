<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Crónica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230f1b2d%22/%3E%20%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20text-anchor%3D%22middle%22%20font-family%3D%22Segoe%20UI%2C%20Helvetica%2C%20Arial%2C%20sans-serif%22%20font-size%3D%2234%22%20font-weight%3D%22700%22%20fill%3D%22%232dd4bf%22%3ETA%3C/text%3E%20%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f7f4ee;
    --tarjeta: #ffffff;
    --texto: #1f2328;
    --suave: #5c636b;
    --borde: #e3ddd2;
    --acento: #7a2e3a;
    --acento-texto: #ffffff;
    --pendiente: #fbeff0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #17181b;
      --tarjeta: #212328;
      --texto: #e8e6e3;
      --suave: #a3a8ae;
      --borde: #34373d;
      --acento: #d98a96;
      --acento-texto: #1a1a1a;
      --pendiente: #2c2226;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--suave); margin: 0 0 20px; font-size: .9rem; }
  h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--suave); margin: 24px 0 8px; display: flex; justify-content: space-between; align-items: baseline;
  }
  h2 button { text-transform: none; letter-spacing: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center;
  }
  li.pend { background: var(--pendiente); border-left: 4px solid var(--acento); }
  li .info { flex: 1; min-width: 0; }
  li a { color: var(--texto); font-weight: 600; text-decoration: none; }
  li a:hover { text-decoration: underline; }
  li.leido a { font-weight: 400; color: var(--suave); }
  li .fecha { color: var(--suave); font-size: .85rem; }
  button {
    font: inherit; font-size: .85rem; cursor: pointer; border-radius: 999px; padding: 6px 12px;
    border: 1px solid var(--acento); background: var(--acento); color: var(--acento-texto); white-space: nowrap;
  }
  button.sec { background: transparent; color: var(--suave); border-color: var(--borde); }
  .link { background: none; border: none; color: var(--acento); padding: 0; }
  .vacio { color: var(--suave); font-style: italic; padding: 4px 2px; }
  .aviso { color: var(--suave); font-size: .8rem; margin-top: 28px; }
  nav { display: flex; gap: 8px; margin: 0 0 16px; }
  nav a {
    font-size: .85rem; text-decoration: none; color: var(--suave); padding: 4px 12px;
    border: 1px solid var(--borde); border-radius: 999px;
  }
  nav a[aria-current] { color: var(--acento-texto); background: var(--acento); border-color: var(--acento); }
</style>
</head>
<body>
<main>
  <nav><a href="./">Prelado</a><a href="cronica.html" aria-current="page">Crónica</a></nav>
  <h1>Crónica</h1>
  <p class="sub" id="resumen">Cargando…</p>
  <h2><span id="t-pend">Pendientes</span><button class="link" id="todos" hidden>Marcar todos como leídos</button></h2>
  <ul id="pend"></ul>
  <h2><span id="t-leidos">Leídos</span></h2>
  <ul id="leidos"></ul>
  <p class="aviso">Lo leído se guarda en este navegador. Fuente: cronicadigital.org, revisado a diario. Los enlaces piden iniciar sesión.</p>
</main>
<script>
  const CLAVE = "lecturas-cronica-leidos";
  let mensajes = []; // números de Crónica: {id, fecha, nombre, url}

  function leerLeidos() {
    try { return new Set(JSON.parse(localStorage.getItem(CLAVE) || "[]")); } catch (e) { return new Set(); }
  }
  let leidos = leerLeidos();
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify([...leidos])); } catch (e) {}
  }


  function item(m, leido) {
    const li = document.createElement("li");
    li.className = leido ? "leido" : "pend";
    const info = document.createElement("div");
    info.className = "info";
    const a = document.createElement("a");
    a.href = m.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = m.nombre;
    info.append(a);
    const b = document.createElement("button");
    b.textContent = leido ? "Desmarcar" : "Leído";
    if (leido) b.className = "sec";
    b.onclick = () => { leido ? leidos.delete(m.url) : leidos.add(m.url); guardar(); pintar(); };
    li.append(info, b);
    return li;
  }

  function pintar() {
    const pend = mensajes.filter(m => !leidos.has(m.url));
    const hechos = mensajes.filter(m => leidos.has(m.url));
    const ulP = document.getElementById("pend"), ulL = document.getElementById("leidos");
    ulP.replaceChildren(...pend.map(m => item(m, false)));
    ulL.replaceChildren(...hechos.map(m => item(m, true)));
    if (!pend.length) ulP.innerHTML = '<li class="vacio" style="background:none;border:none">Nada pendiente.</li>';
    if (!hechos.length) ulL.innerHTML = '<li class="vacio" style="background:none;border:none">Todavía nada.</li>';
    document.getElementById("t-pend").textContent = `Pendientes (${pend.length})`;
    document.getElementById("t-leidos").textContent = `Leídos (${hechos.length})`;
    document.getElementById("todos").hidden = pend.length < 2;
    document.getElementById("resumen").textContent = pend.length
      ? `Tiene ${pend.length} ${pend.length === 1 ? "número pendiente" : "números pendientes"}.`
      : "Está al día.";
    document.title = pend.length ? `(${pend.length}) Crónica` : "Crónica";
  }

  document.getElementById("todos").onclick = () => {
    if (!confirm("¿Marcar todos los pendientes como leídos?")) return;
    mensajes.forEach(m => leidos.add(m.url)); guardar(); pintar();
  };

  fetch("cronica.json?v=" + Date.now())
    .then(r => r.json())
    .then(d => { mensajes = d.sort((a, b) => b.fecha.localeCompare(a.fecha)); pintar(); })
    .catch(() => { document.getElementById("resumen").textContent = "No se pudo cargar la lista. Intente de nuevo en un rato."; });
</script>
</body>
</html>
